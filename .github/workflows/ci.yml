# Continuous integration.
#
# Runs every check that AGENTS.md section 14 requires before merging. The git
# hooks cover the same ground locally, but hooks live on a developer's machine —
# this is the gate that actually holds.
#
# Database integration checks run separately because they need the local
# Supabase stack and must always tear it down, even when a gate fails.

name: CI

# Pull requests only. GitHub checks the merge preview, so a run on main after
# the merge validates a tree that was already green, and nothing here depends on
# a CI result for a main commit — `Deploy database` is dispatched by hand.
#
# The trade-off is real: two pull requests that pass alone can break together.
# Requiring branches to be up to date before merging closes that, and costs
# nothing. Restore `push: branches: [main]` if this ever bites.
#
# Drafts run nothing (Verify's `if`); marking one ready for review starts the run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A superseded run tells you nothing. Cancel it and save the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Also decides which heavy jobs run: a separate job billed a minute for seconds
  # of work, and waiting on Verify means a failed lint never pays for Playwright.
  verify:
    name: Verify
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      database: ${{ steps.scope.outputs.database }}
      studio: ${{ steps.scope.outputs.studio }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commitlint and the scope can diff against the base.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Scope
        id: scope
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          FILES=$(git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD")
          echo "$FILES"

          database=false
          studio=false

          # The workflow itself counts: a change to these rules has to prove it.
          if echo "$FILES" | grep -qE '^(packages/db/|packages/contracts/|\.github/workflows/(ci|deploy-database)\.yml|package\.json|bun\.lock|turbo\.json)'; then
            database=true
          fi

          # Turbo derives what Studio consumes from the workspace graph and reads
          # the lockfile per package, so a dependency bump elsewhere does not count.
          AFFECTED=$(bunx turbo@2.10.8 ls --affected --output=json)
          echo "$AFFECTED"
          if echo "$AFFECTED" | grep -q '"@allfitone/studio-web"' \
             || echo "$FILES" | grep -qE '^\.github/workflows/ci\.yml$'; then
            studio=true
          fi

          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: OpenAPI
        run: bun run check:openapi

      - name: Generated contracts
        run: bun run check:contracts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Everything above this line runs on Bun, which loads a workspace package
      # straight from its TypeScript. ECS runs Node, which cannot. This loads
      # what gets deployed the way production loads it.
      - name: Node entry points
        run: bun run check:node-entrypoints

      # The commit-msg hook covers local commits, but a push from a machine
      # without hooks installed would slip through. This closes that gap.
      - name: Commit messages
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  database:
    name: Database
    needs: verify
    if: needs.verify.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      - name: Database policy
        env:
          DB_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run check:db-policy -- --base "$DB_POLICY_BASE_SHA"

      - name: Start Supabase
        run: bun run db:start

      - name: Reset database
        run: bun run db:reset

      - name: Lint database
        run: bun run db:lint

      - name: Test database
        run: bun run db:test

      - name: Test database concurrency
        run: bun run db:test:concurrency

      # `check:db-types` runs postgres-meta in a container of its own, and pulls
      # it from public.ecr.aws. That registry's limit for anonymous pulls fails
      # this job regularly — twice in twenty minutes on 2026-10-06 — and the
      # failure says nothing about the code. The same image is published on
      # Docker Hub, so take it from there and tag it with the name the Supabase
      # CLI looks for; the CLI then finds it already on the machine and never
      # calls ECR.
      #
      # The tag belongs to the CLI pinned in package.json ("supabase":
      # "2.110.0"). If a CLI bump ever asks for a different one, this step turns
      # into a no-op and the CLI pulls from ECR exactly as it does today, so a
      # stale tag here cannot break the build. That is what continue-on-error
      # protects: a bad or rate-limited pull must not fail the job by itself.
      - name: Preload the type generator image
        continue-on-error: true
        run: |
          image=supabase/postgres-meta:v0.96.6
          docker pull "$image"
          docker tag "$image" "public.ecr.aws/$image"

      - name: Generated database types
        run: bun run check:db-types

      - name: Stop Supabase
        if: always()
        run: bun run db:stop

  studio-e2e:
    name: Studio E2E (${{ matrix.shard }}/4)
    needs: verify
    if: needs.verify.outputs.studio == 'true'
    runs-on: ubuntu-latest
    # A runner has four cores, so Playwright runs two workers, and running in
    # parallel inside one runner was not enough: at 1 714 cases the sweep took
    # 20 minutes against this 25-minute ceiling, and grew by about 300 cases a
    # day. Four runners split it by case count, so each one carries a quarter.
    # Public repositories pay nothing for these minutes; every runner repeats
    # the setup, about a minute and a half. When a shard nears the ceiling
    # again, add shards rather than raising it.
    strategy:
      # A failure in one quarter says nothing about the others: let all report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      # Derived from Studio's own dependencies, not listed by hand. The hand-written
      # version named `telemetry` alone, so the day a second workspace package needed
      # building this job failed on a module it could not resolve.
      - name: Build Studio workspace dependencies
        run: bunx turbo run build --filter=@allfitone/studio-web^...

      # Downloading the browser on every run costs more than storing it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # The browser came from the cache; only its system libraries are missing.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # Next reuses compiled output from its cache, so the e2e build only redoes
      # what changed. The key moves with Studio's sources; older entries still seed it.
      - name: Cache Studio build
        uses: actions/cache@v4
        with:
          path: apps/studio-web/.next-e2e/cache
          key: studio-next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/studio-web/src/**', 'apps/studio-web/next.config.ts') }}
          restore-keys: |
            studio-next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            studio-next-${{ runner.os }}-

      - name: Test Studio interactions
        run: bun run --cwd apps/studio-web test:e2e --shard=${{ matrix.shard }}/4
